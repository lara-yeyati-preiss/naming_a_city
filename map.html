<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Naming a City</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="site-nav">
        <div class="site-nav-left">
          <a href="index.html" class="site-nav-title-link">
            <span class="site-nav-title">Naming a City</span>
          </a>
        </div>

        <nav class="site-nav-links" aria-label="Primary">
          <a href="map.html" class="active">City Map</a>
          <a href="methodology.html">Methodology</a>
        </nav>
      </header>

      <main class="map-main">
        <section class="map-shell" aria-label="Map of venue naming motifs">
          <div id="map" class="mapbox-container"></div>
        </section>

        <aside class="side-panel" aria-label="Motif explorer controls">
          <div class="side-panel-header">
            <div class="side-panel-title-row">
              <h2 class="side-title">Motif explorer</h2>

              <div class="view-toggle" aria-label="View mode toggle">
                <button class="toggle-btn active" data-view="venues" type="button">
                  By Venues
                </button>
                <button class="toggle-btn" data-view="comunas" type="button">
                  By Comunas
                </button>
              </div>
            </div>

            <p class="side-subtitle">
              Each point is a venue. Hover over a point to see details.
            </p>
          </div>

          <section id="motif-panel-list" aria-label="List of motifs">
            <div class="side-section-title">Choose a motif</div>
            <ul class="dashed-list" id="motif-list"></ul>
          </section>

          <section
            id="motif-detail"
            class="profile-card"
            style="display: none;"
            aria-live="polite"
          ></section>
        </aside>
      </main>

      <footer class="map-attribution">
        © <a href="https://www.mapbox.com/" target="_blank" rel="noopener">Mapbox</a>
        © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>
      </footer>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <script src="app.js"></script>
  </body>
</html>
